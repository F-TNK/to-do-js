<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />

    <title>To Do List | JS</title>
  </head>
  <body>
    <main class="toDo">
      <div class="mainTitle">
        <h1>Lista de Tarefas</h1>
      </div>

      <form id="formTask">
        <label for="name">Tarefa:</label>
        <input type="text" name="name" id="name" />

        <label for="date">Data:</label>
        <input type="date" name="date" id="date" />

        <label for="lvl">Classificação:</label>
        <select name="lvl" id="lvl">
          <option value="urg">Normal</option>
          <option value="atent">Atenção</option>
          <option value="norm">Ungente</option>
        </select>

        <p id="listDescript" class="listDescript"></p>

        <button type="submit">Criar</button>
        <p id="msg" class="error" hidden></p>
      </form>

      <label for="search">Buscar Tarefa</label>
      <input type="search" name="search" id="search" />

      <div class="container">
        <button class="filter" data-filter="all">Todas</button>
        <button class="filter" data-filter="urg">Normal</button>
        <button class="filter" data-filter="atent">Atenção</button>
        <button class="filter" data-filter="norm">Ungente</button>
      </div>

      <ul id="list" class="taskList"></ul>
      <p id="empty" hidden>Sem tarefas pendentes</p>
    </main>
    <script src="js/to-do.js"></script>
  </body>
</html>
